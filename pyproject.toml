[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eidryl"
version = "0.1.0"
description = "Learn portable executable models from trusted stateful APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Nazeeh Abdul-Hadi"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
eidryl = "eidryl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eidryl = ["assets/*"]
